[package]
name = "cabinet"
version = "0.1.0"
edition = "2021"

[dependencies]
async-stream = "0.3"
axum = "0.8"
axum-extra = { version = "0.10.0", features = ["file-stream"] }
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.10"
sqlx = { version = "0.6", features = ["runtime-tokio-native-tls", "sqlite"] }